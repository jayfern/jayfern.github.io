<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Shelf — Jay Fernando</title>
<meta name="description" content="What Jay Fernando is reading, listening to, and watching.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ramaraja&family=Rufina:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body class="page-reading">

<nav class="program-nav" id="program-nav"></nav>

<main>
  <div class="shelf-stage">
    <!-- js/bookshelf.js fills this with the stacked bookcase (books, albums, shows, movies) -->
    <div id="shelf-rows" role="region" aria-label="Shelves"></div>

    <div class="shelf-side">
      <h1 class="shelf-title">my shelf</h1>

      <!-- js/bookshelf.js puts "currently reading", then the clicked item's review, here -->
      <aside id="featured-book" class="featured-book" aria-live="polite">
        <p class="featured-book__empty">Pick something off the shelves to read what I thought of it.</p>
      </aside>
    </div>
  </div>
</main>

<script src="js/main.js"></script>
<script src="js/bookshelf.js"></script>
</body>
</html>
